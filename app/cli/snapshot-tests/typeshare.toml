[typescript]
no-version-header = true

[typescript.type_mappings]
Url = "string"
DateTime = "string"

[io-ts]
no-version-header = true
# Snapshots import their types from the typescript snapshot next to them
types-import = "./output"

[io-ts.type_mappings]
Url = "t.string"
DateTime = "t.string"

[kotlin]
package = "com.agilebits.onepassword"
no-version-header = true

[kotlin.type_mappings]
Url = "String"
DateTime = "String"

[swift]
no_version_header = true

[swift.type_mappings]
"Url" = "String"
"DateTime" = "Date"
